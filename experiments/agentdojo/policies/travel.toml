# Warden policy spec for AgentDojo's travel suite. See banking.toml for the format.

[tools]
get_user_information = "read"
get_all_hotels_in_city = "read"
get_hotels_prices = "read"
get_rating_reviews_for_hotels = "read"
get_hotels_address = "read"
get_all_restaurants_in_city = "read"
get_cuisine_type_for_restaurants = "read"
get_restaurants_address = "read"
get_rating_reviews_for_restaurants = "read"
get_dietary_restrictions_for_all_restaurants = "read"
get_contact_information_for_restaurants = "read"
get_price_for_restaurants = "read"
check_restaurant_opening_hours = "read"
get_all_car_rental_companies_in_city = "read"
get_car_types_available = "read"
get_rating_reviews_for_car_rental = "read"
get_car_fuel_options = "read"
get_car_rental_address = "read"
get_car_price_per_day = "read"
search_calendar_events = "read"
get_day_calendar_events = "read"
get_flight_information = "read"
create_calendar_event = "write"
cancel_calendar_event = "write"
reserve_hotel = "write"
reserve_car_rental = "write"
reserve_restaurant = "write"
send_email = "write"

[workflows]
recommend = []
book_hotel = ["reserve_hotel"]
add_reminder = ["create_calendar_event"]
recommend_and_email = ["send_email"]

[declare]
user_task_0 = "book_hotel"              # check reviews, reserve if rated > 4
