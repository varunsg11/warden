[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-agent-governance"
version = "0.1.0"
description = "A capability-governed runtime that defends LLM agents against indirect prompt injection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Varun", email = "varunsg118@gmail.com" }]
keywords = [
    "llm", "agents", "security", "prompt-injection", "authorization",
    "capabilities", "least-privilege", "langgraph", "ai-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.1",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "pynacl>=1.5",             # Ed25519 signing of capabilities
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/varunsg11/warden"
Repository = "https://github.com/varunsg11/warden"
Issues = "https://github.com/varunsg11/warden/issues"

[project.scripts]
warden = "warden.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["warden*"]

[tool.setuptools.package-data]
warden = ["py.typed", "corpus/docs/*.txt"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["warden"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true      # langgraph / nacl ship no stubs
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]               # run tests without an editable install
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["warden"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
